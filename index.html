<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал пар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Макет: одна колонка до 560px; главный экран — недельная сетка «день × пара», внизу три раздела. */
:root {
  --bg: #171918;
  --surface: #1b1e1d;
  --ink: #f2f3f2;
  --muted: #858b88;
  --line: #303635;
  --accent: #a77caf;
  --accent-ink: #ffffff;
  --today-bg: #76577d;
  --today-ink: #ffffff;
  --good: #62d5a2;
  --good-bg: #173b30;
  --bad: #f07882;
  --bad-bg: #4a2027;
  --neutral: #a2a8a5;
  --neutral-bg: #303634;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
:root[data-theme="dark"] {
  --bg: #171918; --surface: #1b1e1d; --ink: #f2f3f2; --muted: #858b88; --line: #303635;
  --accent: #a77caf; --accent-ink: #ffffff; --today-bg: #76577d; --today-ink: #ffffff;
  --good: #62d5a2; --good-bg: #173b30; --bad: #f07882; --bad-bg: #4a2027;
  --neutral: #a2a8a5; --neutral-bg: #303634;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; min-height: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.shell { max-width: 560px; margin: 0 auto; padding: 20px 16px 104px; }
header.top { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.eyebrow { color: var(--muted); font-size: 13px; }
.who { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2; text-wrap: balance; overflow-wrap: anywhere; }
h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 14px; font-weight: 600; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
input[type="text"] { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.primary { min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 18px; }
.ghost { min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 14px; font-weight: 500; }


:root[data-palette="violet"] {
  --bg: #0d0913; --surface: #181020; --ink: #f5efff; --muted: #a99bb8; --line: #382747;
  --accent: #a855f7; --accent-ink: #ffffff; --today-bg: #6d3aa3; --today-ink: #ffffff; --good: #65d6a5; --good-bg: #173b30;
  --bad: #f07882; --bad-bg: #4a2027; --neutral: #a7a0ad; --neutral-bg: #302b35;
}
:root[data-palette="blue"] {
  --bg: #10171e; --surface: #18232d; --ink: #edf5ff; --muted: #91a6b8; --line: #304454;
  --accent: #66a9df; --accent-ink: #071522; --today-bg: #48769b; --today-ink: #ffffff; --good: #65d6a5; --good-bg: #173b30;
  --bad: #f07882; --bad-bg: #4a2027; --neutral: #a7b2bc; --neutral-bg: #2b3945;
}
:root[data-palette="green"] {
  --bg: #101916; --surface: #19241f; --ink: #eff8f1; --muted: #9aafa2; --line: #30463a;
  --accent: #69bd91; --accent-ink: #07170e; --today-bg: #4a8466; --today-ink: #ffffff; --good: #65d6a5; --good-bg: #173b30;
  --bad: #f07882; --bad-bg: #4a2027; --neutral: #a7b2aa; --neutral-bg: #2c3931;
}
:root[data-palette="light"] {
  --bg: #f0edf4; --surface: #ffffff; --ink: #211a29; --muted: #766b80; --line: #ded5e7;
  --accent: #80539a; --accent-ink: #ffffff; --today-bg: #e4daec; --today-ink: #211a29;
  --good: #218653; --good-bg: #dff3e8; --bad: #c83f50; --bad-bg: #fbe4e7;
  --neutral: #73717a; --neutral-bg: #eceaf0;
  color-scheme: light;
}
:root[data-layout="old"] .grid {
  grid-template-columns: minmax(64px, 1.1fr) repeat(5, minmax(0, 1fr));
}
:root[data-layout="old"] .day {
  align-items: flex-start; justify-content: center; padding: 6px 4px 6px 8px;
  text-align: left; min-height: 44px; background: var(--bg);
}
:root[data-layout="old"] .day b { font-size: 15px; }
:root[data-layout="old"] .day span { font-size: 12px; }
:root[data-layout="old"] .colhead { color: var(--muted); }
:root[data-layout="new"] .day.today { background: var(--today-bg); border-color: var(--today-bg); color: var(--today-ink); }
:root[data-layout="new"] .day.today b, :root[data-layout="new"] .day.today span { color: var(--today-ink); }
.settings-select {
  width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px; background: var(--bg); color: var(--ink);
}
.colorrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type="color"] {
  width: 100%; min-height: 52px; padding: 5px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); cursor: pointer;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 7px; }
input[type="color"]::-moz-color-swatch { border: 0; border-radius: 7px; }

/* Недельная навигация */
.weeknav { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin-bottom: 12px; }
.weeknav .ghost { padding: 0; font-size: 20px; }
.weektitle { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.weektitle small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.todaybtn { margin-bottom: 12px; width: 100%; }

/* Сетка: 1 колонка с днём + 5 клеток */
.grid { display: grid; grid-template-columns: 42px repeat(6, minmax(0, 1fr)); gap: 5px; align-items: center; }
.colhead { text-align: center; font-size: 12px; font-weight: 700; color: var(--accent); }
.day { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding: 5px 1px; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: center; font: inherit; color: inherit; min-width: 0; }
.day:hover { border-color: var(--accent); }

.overlay { position: fixed; inset: 0; background: rgba(5, 15, 14, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow-y: auto; }
.sheet h3 { margin: 0; font-size: 18px; }
.status-btns { display: grid; gap: 10px; }
.sbtn { min-height: 54px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 17px; text-align: left; padding: 0 16px; }
.sbtn.present { background: var(--good-bg); color: var(--good); }
.sbtn.absent { background: var(--bad-bg); color: var(--bad); }
.sbtn.none { background: var(--neutral-bg); color: var(--neutral); }
.day b { font-size: 11px; }
.day span { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day.weekend b { color: var(--muted); }
.day.today { background: var(--today-bg); border-color: var(--today-bg); color: var(--today-ink); }
.day.today b, .day.today span { color: var(--today-ink); }
.day.today::after { content: "сегодня"; font-size: 10px; color: inherit; opacity: .75; font-weight: 600; }
.cell {
  aspect-ratio: 1 / 1; width: 100%; min-height: 44px; border-radius: 10px; padding: 0;
  border: 1.5px dashed var(--line); background: transparent; font-size: 20px; font-weight: 700; line-height: 1;
}
.cell.present { background: var(--good-bg); color: var(--good); border: 1.5px solid var(--good); }
.cell.absent { background: var(--bad-bg); color: var(--bad); border: 1.5px solid var(--bad); }
.cell.none { background: var(--neutral-bg); color: var(--neutral); border: 1.5px solid var(--neutral); }
.cell:active { transform: scale(.96); }
.todayrow .cell:not(.present):not(.absent):not(.none) { border-color: var(--accent); }
.lessonhead { text-align: center; color: var(--muted); font-size: 12px; font-weight: 700; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; border: 1.5px solid; }
.legend i.present { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.legend i.absent { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.legend i.none { background: var(--neutral-bg); color: var(--neutral); border-color: var(--neutral); }
.legend i.empty { border-style: dashed; border-color: var(--line); }

.weeksum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
.weeksum b { font-size: 20px; font-variant-numeric: tabular-nums; color: var(--accent); }

/* Статистика */
.big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pct { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.pct-note { color: var(--muted); font-size: 14px; max-width: 24ch; }
.bar { height: 10px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; margin-top: 14px; }
.bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.tile { background: var(--bg); border-radius: 10px; padding: 10px 6px; text-align: center; min-width: 0; }
.tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }
.months { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
.mhead { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mhead span:first-child { text-transform: capitalize; }
.msub { color: var(--muted); font-size: 13px; }
.mbar { height: 8px; border-radius: 999px; background: var(--neutral-bg); overflow: hidden; margin: 6px 0 4px; }
.mbar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { border: 0; background: none; min-height: 60px; padding: 8px 4px; font-weight: 500; color: var(--muted); border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.foot { color: var(--muted); font-size: 12px; text-align: center; margin: 20px 0 0; }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div id="layer"></div>
<script>
(function () {
  "use strict";

  /* ---------- Константы и состояние ---------- */
  var DEFAULT_NAME = "Осипова Дарина";
  var LS_KEY = "journal-par-v1";
  var LESSONS = [1, 2, 3, 4, 5];
  var DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  var MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  var STATUS = {
    present: { mark: "✓", text: "Присутствовал(а)" },
    absent: { mark: "П", text: "Пропуск" },
    none: { mark: "—", text: "Нет пары" }
  };
  // Порядок смены по нажатию на клетку: пусто → был → пропуск → нет пары → пусто
  var CYCLE = [null, "present", "absent", "none"];

  var state = { name: DEFAULT_NAME, marks: [], layout: "new", palette: "graphite", custom: { bg: "#171918", accent: "#a77caf" } };
  var tab = "grid";
  var storeKind = "local";
  var dbRef = null;
  var queue = Promise.resolve();
  var toastTimer = null;
  var weekStart = mondayOf(todayISO());

  var app = document.getElementById("app");

  /* ---------- Даты ---------- */
  function parseISO(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function toISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function todayISO() { return toISO(new Date()); }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function mondayOf(iso) { var d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
  function short(iso) { var p = iso.split("-"); return p[2] + "." + p[1]; }
  function full(iso) { return iso.split("-").reverse().join("."); }

  /* ---------- Цвета: любые два цвета пользователя ---------- */
  var DEFAULT_COLORS = { bg: "#171918", accent: "#a77caf" };
  var CUSTOM_VARS = ["--bg", "--surface", "--ink", "--muted", "--line", "--accent", "--accent-ink",
    "--today-bg", "--today-ink", "--good", "--good-bg", "--bad", "--bad-bg", "--neutral", "--neutral-bg"];

  function isHex(v) { return typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v); }
  function hexToRgb(hex) {
    var s = hex.replace("#", "");
    if (s.length === 3) s = s.charAt(0) + s.charAt(0) + s.charAt(1) + s.charAt(1) + s.charAt(2) + s.charAt(2);
    var n = parseInt(s, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgbToHex(c) {
    function p(v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? "0" : "") + v.toString(16); }
    return "#" + p(c.r) + p(c.g) + p(c.b);
  }
  // t — доля второго цвета: 0 → a, 1 → b
  function mixColor(a, b, t) {
    var A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex({ r: A.r + (B.r - A.r) * t, g: A.g + (B.g - A.g) * t, b: A.b + (B.b - A.b) * t });
  }
  function luminance(hex) {
    var c = hexToRgb(hex);
    function ch(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    return 0.2126 * ch(c.r) + 0.7152 * ch(c.g) + 0.0722 * ch(c.b);
  }
  function contrast(a, b) {
    var la = luminance(a), lb = luminance(b), hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }
  function isDark(hex) { return contrast(hex, "#ffffff") > contrast(hex, "#111111"); }
  function readableOn(hex) { return contrast(hex, "#ffffff") >= 3 ? "#ffffff" : "#111111"; }

  // Из двух выбранных цветов (фон + акцент) получаем все оттенки интерфейса.
  function customVars(bg, accent) {
    var dark = isDark(bg);
    var surface = dark ? mixColor(bg, "#ffffff", 0.06) : mixColor(bg, "#ffffff", 0.78);
    var ink = dark ? mixColor("#ffffff", bg, 0.06) : mixColor("#000000", bg, 0.10);
    var muted = mixColor(ink, bg, dark ? 0.45 : 0.42);
    var line = mixColor(ink, bg, dark ? 0.82 : 0.80);
    var good = dark ? "#62d5a2" : "#218653";
    var bad = dark ? "#f07882" : "#c83f50";
    var todayBg = mixColor(accent, bg, dark ? 0.42 : 0.30);
    return {
      "--bg": bg,
      "--surface": surface,
      "--ink": ink,
      "--muted": muted,
      "--line": line,
      "--accent": accent,
      "--accent-ink": readableOn(accent),
      "--today-bg": todayBg,
      "--today-ink": readableOn(todayBg),
      "--good": good,
      "--good-bg": dark ? mixColor(good, bg, 0.80) : mixColor(good, "#ffffff", 0.82),
      "--bad": bad,
      "--bad-bg": dark ? mixColor(bad, bg, 0.80) : mixColor(bad, "#ffffff", 0.82),
      "--neutral": muted,
      "--neutral-bg": mixColor(muted, bg, dark ? 0.78 : 0.86)
    };
  }

  /* ---------- Утилиты ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function lessonName(n) { return n + " пара"; }
  function findMark(date, n) {
    var name = lessonName(n);
    return state.marks.find(function (m) { return m.date === date && m.lesson === name; });
  }
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === "class") el.className = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    });
    function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }
  function toast(msg) {
    var old = document.getElementById("toast");
    if (old) old.remove();
    var t = h("div", { class: "toast", id: "toast", role: "status" }, msg);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------- Подсчёт (пары со статусом «Нет пары» в процент не входят) ---------- */
  function tally(marks) {
    var s = { total: marks.length, present: 0, absent: 0, none: 0 };
    marks.forEach(function (m) { s[m.status]++; });
    var counted = s.present + s.absent;
    s.counted = counted;
    s.percent = counted ? (s.present / counted) * 100 : null;
    return s;
  }
  function pctText(p) { return p == null ? "—" : Math.round(p) + "%"; }

  /* ---------- Хранение ---------- */
  function clean(data) {
    var out = { name: DEFAULT_NAME, marks: [], layout: "new", palette: "graphite",
      custom: { bg: DEFAULT_COLORS.bg, accent: DEFAULT_COLORS.accent } };
    if (data && typeof data.name === "string" && data.name.trim()) out.name = data.name.slice(0, 64);
    if (data && (data.layout === "old" || data.layout === "new")) out.layout = data.layout;
    if (data && ["graphite", "violet", "blue", "green", "light", "custom"].indexOf(data.palette) !== -1) out.palette = data.palette;
    if (data && data.custom && typeof data.custom === "object") {
      if (isHex(data.custom.bg)) out.custom.bg = data.custom.bg.toLowerCase();
      if (isHex(data.custom.accent)) out.custom.accent = data.custom.accent.toLowerCase();
    }
    if (data && Array.isArray(data.marks)) {
      data.marks.forEach(function (m) {
        if (m && typeof m.date === "string" && typeof m.lesson === "string" && STATUS[m.status]) {
          out.marks.push({ id: String(m.id || uid()), date: m.date, lesson: m.lesson, status: m.status });
        }
      });
    }
    return out;
  }
  function readLocal() {
    try { var raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function persist() {
    var snapshot = JSON.parse(JSON.stringify(state));
    try { localStorage.setItem(LS_KEY, JSON.stringify(snapshot)); } catch (e) {}
    if (dbRef) {
      queue = queue.then(function () { return dbRef.set(snapshot); }).catch(function () {
        toast("Не удалось сохранить в аккаунте");
      });
    }
  }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (res) { setTimeout(function () { res(null); }, ms); })]);
  }
  async function connectDb() {
    try {
      if (typeof claude === "undefined" || !claude.use) return;
      var pair = await Promise.all([withTimeout(claude.use("db"), 4000), withTimeout(claude.use("user"), 4000)]);
      var db = pair[0], user = pair[1];
      if (!db || !user) return;
      var id = await user.id();
      if (!id) return;
      var ref = db.collection("data/users/" + id).doc("state");
      var snap = await withTimeout(ref.get(), 5000);
      if (!snap) return;
      dbRef = ref;
      storeKind = "db";
      if (snap.exists) {
        state = clean(JSON.parse(JSON.stringify(snap.data())));
        applyAppearance();
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      } else if (state.marks.length || state.name !== DEFAULT_NAME) {
        persist();
      }
      render();
    } catch (e) { /* остаёмся на локальном хранении */ }
  }

  /* ---------- Действия ---------- */
  function cycleCell(date, n) {
    var m = findMark(date, n);
    var cur = m ? m.status : null;
    var next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];
    if (m && next === null) state.marks = state.marks.filter(function (x) { return x !== m; });
    else if (m) m.status = next;
    else state.marks.push({ id: uid(), date: date, lesson: lessonName(n), status: next });
    persist();
    render();
    var again = document.querySelector('[data-cell="' + date + "|" + n + '"]');
    if (again) again.focus();
  }
  // Пометить весь день сразу (status = null — очистить день)
  function setDay(date, status) {
    LESSONS.forEach(function (n) {
      var m = findMark(date, n);
      if (status === null) {
        if (m) state.marks = state.marks.filter(function (x) { return x !== m; });
      } else if (m) {
        m.status = status;
      } else {
        state.marks.push({ id: uid(), date: date, lesson: lessonName(n), status: status });
      }
    });
    persist();
    closeSheet();
    render();
    toast(status === null ? "День очищен" : "День отмечен: " + STATUS[status].text);
  }
  function closeSheet() { document.getElementById("layer").textContent = ""; }
  function openDaySheet(date, dayName) {
    var panel = h("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": "Отметить весь день" },
      h("h3", null, dayName + ", " + full(date)),
      h("p", { class: "hint" }, "Отметить сразу все " + LESSONS.length + " пар этого дня. Прежние отметки за день заменятся."),
      h("div", { class: "status-btns" },
        h("button", { class: "sbtn present", onclick: function () { setDay(date, "present"); } }, "✅ Присутствовал(а) весь день"),
        h("button", { class: "sbtn absent", onclick: function () { setDay(date, "absent"); } }, "❌ Пропуск весь день"),
        h("button", { class: "sbtn none", onclick: function () { setDay(date, "none"); } }, "⚪ Нет пар в этот день")
      ),
      h("button", { class: "ghost", onclick: function () { setDay(date, null); } }, "Очистить день"),
      h("button", { class: "ghost", onclick: closeSheet }, "Закрыть")
    );
    var ov = h("div", { class: "overlay", onclick: function (e) { if (e.target === ov) closeSheet(); } }, panel);
    var layer = document.getElementById("layer");
    layer.textContent = "";
    layer.appendChild(ov);
  }
  function rename(value) {
    var name = value.replace(/\s+/g, " ").trim();
    if (!name) { toast("Введите имя"); return; }
    if (name.length > 64) { toast("Не больше 64 символов"); return; }
    state.name = name; persist(); toast("Имя сохранено"); tab = "grid"; render();
  }

  /* ---------- Экран 1: сетка недели ---------- */
  function screenGrid() {
    var days = [];
    for (var i = 0; i < 6; i++) days.push(addDays(weekStart, i));
    var today = todayISO();
    var weekMarks = state.marks.filter(function (m) { return m.date >= days[0] && m.date <= days[5]; });
    var ws = tally(weekMarks);

    var cells = [];
    if (state.layout === "old") {
      cells.push(h("div", { class: "lessonhead" }, "День"));
      LESSONS.forEach(function (n) { cells.push(h("div", { class: "colhead" }, String(n))); });
      days.forEach(function (d, idx) {
        var cls = "day" + (idx >= 5 ? " weekend" : "") + (d === today ? " today" : "");
        cells.push(h("button", {
          class: cls,
          "aria-label": DAYS[idx] + " " + short(d) + ": отметить весь день",
          onclick: function () { openDaySheet(d, DAYS[idx]); }
        }, h("b", null, DAYS[idx]), h("span", null, short(d))));
        LESSONS.forEach(function (n) {
          var m = findMark(d, n), st = m ? m.status : null;
          cells.push(h("button", {
            class: "cell" + (st ? " " + st : ""),
            "data-cell": d + "|" + n,
            "aria-label": DAYS[idx] + " " + short(d) + ", " + n + " пара: " + (st ? STATUS[st].text : "не отмечено"),
            onclick: function () { cycleCell(d, n); }
          }, st ? STATUS[st].mark : ""));
        });
      });
    } else {
      cells.push(h("div", { class: "lessonhead" }, "Пара"));
      days.forEach(function (d, idx) {
        var cls = "day" + (idx >= 5 ? " weekend" : "") + (d === today ? " today" : "");
        cells.push(h("button", {
          class: cls,
          "aria-label": DAYS[idx] + " " + short(d) + ": отметить весь день",
          onclick: function () { openDaySheet(d, DAYS[idx]); }
        }, h("b", null, DAYS[idx]), h("span", null, short(d))));
      });
      LESSONS.forEach(function (n) {
        cells.push(h("div", { class: "lessonhead" }, String(n)));
        days.forEach(function (d, idx) {
          var m = findMark(d, n), st = m ? m.status : null;
          cells.push(h("button", {
            class: "cell" + (st ? " " + st : ""),
            "data-cell": d + "|" + n,
            "aria-label": DAYS[idx] + " " + short(d) + ", " + n + " пара: " + (st ? STATUS[st].text : "не отмечено"),
            onclick: function () { cycleCell(d, n); }
          }, st ? STATUS[st].mark : ""));
        });
      });
    }

    var isCurrent = weekStart === mondayOf(today);
    return h("div", { class: "stack" },
      h("div", null,
        h("div", { class: "weeknav" },
          h("button", { class: "ghost", "aria-label": "Предыдущая неделя", onclick: function () { weekStart = addDays(weekStart, -7); render(); } }, "‹"),
          h("div", { class: "weektitle" }, short(days[0]) + " – " + full(days[5]), h("small", null, state.layout === "old" ? "Дни слева, номера пар сверху" : "Дни недели сверху, пары слева")),
          h("button", { class: "ghost", "aria-label": "Следующая неделя", onclick: function () { weekStart = addDays(weekStart, 7); render(); } }, "›")
        ),
        isCurrent ? null : h("button", { class: "ghost todaybtn", onclick: function () { weekStart = mondayOf(todayISO()); render(); } }, "К текущей неделе")
      ),
      h("div", { class: "card" },
        h("div", { class: "grid", role: "group", "aria-label": "Посещаемость за неделю" }, cells),
        h("div", { class: "weeksum" },
          h("span", null, ws.counted ? "За неделю: " + ws.present + " из " + ws.counted : "За неделю отметок нет"),
          h("b", null, pctText(ws.percent))
        ),
        h("div", { class: "legend" },
          h("span", null, h("i", { class: "present" }, "✓"), "был(а)"),
          h("span", null, h("i", { class: "absent" }, "✕"), "пропуск"),
          h("span", null, h("i", { class: "none" }, "—"), "нет пары"),
          h("span", null, h("i", { class: "empty" }), "не отмечено")
        )
      ),
      h("p", { class: "hint" }, "Нажимайте на клетку: пусто → ✓ → ✕ → — → пусто. Нажмите на день недели, чтобы отметить весь день сразу.")
    );
  }

  /* ---------- График по неделям (SVG, последние 10 недель) ---------- */
  function svgEl(tag, attrs, text) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (text != null) el.textContent = text;
    return el;
  }
  function weeklyChart() {
    var latest = state.marks.reduce(function (a, m) { return m.date > a ? m.date : a; }, todayISO());
    var end = mondayOf(latest), N = 10, weeks = [];
    for (var i = N - 1; i >= 0; i--) weeks.push(addDays(end, -7 * i));
    var data = weeks.map(function (ws) {
      var we = addDays(ws, 6);
      return { ws: ws, t: tally(state.marks.filter(function (m) { return m.date >= ws && m.date <= we; })) };
    });
    var W = 520, H = 230, L = 38, R = 8, T = 18, B = 34;
    var pw = W - L - R, ph = H - T - B, slot = pw / N, bw = Math.min(28, slot * 0.62);
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img",
      "aria-label": "График посещаемости по неделям, последние 10 недель" });
    [0, 50, 100].forEach(function (v) {
      var y = T + ph - (v / 100) * ph;
      svg.appendChild(svgEl("line", { x1: L, x2: W - R, y1: y, y2: y, "stroke-width": 1, style: "stroke:var(--line)" }));
      svg.appendChild(svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end", "font-size": 11, style: "fill:var(--muted)" }, v + "%"));
    });
    data.forEach(function (d, i) {
      var cx = L + slot * i + slot / 2, p = d.t.percent;
      if (p != null) {
        var bh = Math.max(2, (p / 100) * ph);
        svg.appendChild(svgEl("rect", { x: cx - bw / 2, y: T + ph - bh, width: bw, height: bh, rx: 4, style: "fill:var(--accent)" }));
        svg.appendChild(svgEl("text", { x: cx, y: T + ph - bh - 5, "text-anchor": "middle", "font-size": 11, "font-weight": 600, style: "fill:var(--ink)" }, Math.round(p) + "%"));
      }
      svg.appendChild(svgEl("text", { x: cx, y: H - 14, "text-anchor": "middle", "font-size": 10, style: "fill:var(--muted)" }, short(d.ws)));
    });
    return h("div", { class: "card" },
      h("h2", null, "По неделям"),
      svg,
      h("p", { class: "hint" }, "Процент посещаемости за неделю. Подпись под столбцом — понедельник недели. Пустое место — отметок не было.")
    );
  }

  /* ---------- Экран 2: статистика ---------- */
  function screenStats() {
    var s = tally(state.marks);
    if (!s.total) return h("div", { class: "card empty" }, "Пока нет ни одной отметки. Заполните клетки в разделе «Отметить пару».");

    var byMonth = {};
    state.marks.forEach(function (m) { var k = m.date.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(m); });
    var keys = Object.keys(byMonth).sort().reverse();

    return h("div", { class: "stack" },
      h("div", { class: "card" },
        h("div", { class: "big" },
          h("span", { class: "pct" }, s.percent == null ? "—" : s.percent.toFixed(1).replace(".", ",") + "%"),
          h("span", { class: "pct-note" }, "посещаемость. «Нет пары» в расчёт не входит")
        ),
        h("div", { class: "bar", "aria-hidden": "true" }, h("span", { style: "width:" + (s.percent || 0) + "%" })),
        h("div", { class: "tiles" },
          h("div", { class: "tile" }, h("b", null, String(s.total)), h("span", null, "отмечено")),
          h("div", { class: "tile" }, h("b", null, String(s.present)), h("span", null, "посещено")),
          h("div", { class: "tile" }, h("b", null, String(s.absent)), h("span", null, "пропущено")),
          h("div", { class: "tile" }, h("b", null, String(s.none)), h("span", null, "нет пары"))
        )
      ),
      weeklyChart(),
      h("div", { class: "card" },
        h("h2", null, "По месяцам"),
        h("ul", { class: "months" }, keys.map(function (k) {
          var t = tally(byMonth[k]);
          var y = k.slice(0, 4), mo = parseInt(k.slice(5), 10) - 1;
          return h("li", null,
            h("div", { class: "mhead" }, h("span", null, MONTHS[mo] + " " + y), h("span", null, pctText(t.percent))),
            h("div", { class: "mbar", "aria-hidden": "true" }, h("span", { style: "width:" + (t.percent || 0) + "%" })),
            h("div", { class: "msub" }, "посещено " + t.present + ", пропущено " + t.absent + ", нет пары " + t.none)
          );
        }))
      )
    );
  }

  /* ---------- Экран 3: настройки ---------- */
  function screenSettings() {
    var input = h("input", { type: "text", id: "f-name", value: state.name, maxlength: "64", autocomplete: "off" });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") rename(input.value); });

    var layout = h("select", { class: "settings-select", id: "f-layout", "aria-label": "Вариант журнала" },
      h("option", { value: "new" }, "Новый вариант — дни сверху"),
      h("option", { value: "old" }, "Старый вариант — дни слева")
    );
    layout.value = state.layout;
    layout.addEventListener("change", function () {
      state.layout = layout.value;
      applyAppearance();
      persist();
      render();
      toast("Вариант журнала изменён");
    });

    var palette = h("select", { class: "settings-select", id: "f-palette", "aria-label": "Цветовое сочетание" },
      h("option", { value: "graphite" }, "Графитовый + приглушённый фиолетовый"),
      h("option", { value: "violet" }, "Чёрный + яркий фиолетовый"),
      h("option", { value: "blue" }, "Тёмно-синий + голубой"),
      h("option", { value: "green" }, "Тёмно-зелёный + мятный"),
      h("option", { value: "light" }, "Светлый + сиреневый"),
      h("option", { value: "custom" }, "Свои цвета")
    );
    palette.value = state.palette;
    palette.addEventListener("change", function () {
      state.palette = palette.value;
      applyAppearance();
      persist();
      render();
      toast("Цвета изменены");
    });

    var bgPick = h("input", { type: "color", id: "f-color-bg", value: state.custom.bg, "aria-label": "Основной цвет фона" });
    var acPick = h("input", { type: "color", id: "f-color-accent", value: state.custom.accent, "aria-label": "Акцентный цвет" });

    function previewCustom() {
      state.custom = { bg: bgPick.value, accent: acPick.value };
      state.palette = "custom";
      palette.value = "custom";
      applyAppearance();
    }
    function saveCustom() {
      previewCustom();
      persist();
      toast("Свои цвета применены");
    }
    bgPick.addEventListener("input", previewCustom);
    acPick.addEventListener("input", previewCustom);
    bgPick.addEventListener("change", saveCustom);
    acPick.addEventListener("change", saveCustom);

    return h("div", { class: "stack" },
      h("div", { class: "card stack" },
        h("div", { class: "field" },
          h("label", { class: "label", for: "f-name" }, "Имя или никнейм студента"),
          input,
          h("p", { class: "hint" }, "Отметки сохранятся, поменяется только имя в приложении.")
        ),
        h("button", { class: "primary", onclick: function () { rename(input.value); } }, "Сохранить имя")
      ),
      h("div", { class: "card stack" },
        h("div", { class: "field" },
          h("label", { class: "label", for: "f-layout" }, "Вариант оформления журнала"),
          layout,
          h("p", { class: "hint" }, "Можно в любой момент переключаться между новым и старым расположением дней и пар.")
        ),
        h("div", { class: "field" },
          h("label", { class: "label", for: "f-palette" }, "Готовое цветовое сочетание"),
          palette,
          h("p", { class: "hint" }, "Выберите готовую пару цветов или настройте свою ниже.")
        ),
        h("div", { class: "field" },
          h("span", { class: "label" }, "Свои два цвета"),
          h("div", { class: "colorrow" },
            h("div", { class: "field" },
              h("label", { class: "hint", for: "f-color-bg" }, "Фон"),
              bgPick
            ),
            h("div", { class: "field" },
              h("label", { class: "hint", for: "f-color-accent" }, "Акцент"),
              acPick
            )
          ),
          h("p", { class: "hint" }, "Выберите любые два цвета — фон и акцент. Остальные оттенки (текст, карточки, рамки) подберутся автоматически и останутся читаемыми.")
        )
      )
    );
  }

  var TABS = [
    { id: "grid", label: "Отметить пару", view: screenGrid },
    { id: "stats", label: "Статистика", view: screenStats },
    { id: "settings", label: "Настройки", view: screenSettings }
  ];

  function applyAppearance() {
    var root = document.documentElement;
    root.setAttribute("data-layout", state.layout || "new");
    var palette = state.palette || "graphite";
    root.setAttribute("data-palette", palette);
    var vars = palette === "custom" ? customVars(state.custom.bg, state.custom.accent) : null;
    CUSTOM_VARS.forEach(function (name) {
      if (vars) root.style.setProperty(name, vars[name]);
      else root.style.removeProperty(name);
    });
    root.style.colorScheme = vars ? (isDark(state.custom.bg) ? "dark" : "light") : (palette === "light" ? "light" : "dark");
  }

  function render() {
    var current = TABS.find(function (t) { return t.id === tab; });
    var nav = h("nav", { class: "tabs", "aria-label": "Разделы" },
      h("div", { class: "in" }, TABS.map(function (t) {
        return h("button", { "aria-current": t.id === tab ? "page" : null, onclick: function () { tab = t.id; render(); } }, t.label);
      })));
    var oldNav = document.querySelector("nav.tabs");
    if (oldNav) oldNav.remove();
    app.textContent = "";
    app.append(
      h("header", { class: "top" },
        h("span", { class: "eyebrow" }, "Журнал пар · " + current.label),
        h("h1", { class: "who" }, state.name)
      ),
      current.view(),
      h("p", { class: "foot" }, storeKind === "db" ? "Данные сохраняются в вашем аккаунте." : "Данные хранятся только в этом браузере.")
    );
    document.body.appendChild(nav);
  }

  /* ---------- Старт ---------- */
  var local = readLocal();
  if (local) state = clean(local);
  applyAppearance();
  render();
  connectDb();
})();
</script>
</body>
</html>
